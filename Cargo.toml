[package]
name = "yubikey"
version = "0.9.0-pre.0"
description = """
Pure Rust cross-platform host-side driver for YubiKey devices from Yubico with
support for hardware-backed public-key decryption and digital signatures using
the Personal Identity Verification (PIV) application. Supports RSA (1024/2048/3072/4096)
or ECC (NIST P-256/P-384) algorithms e.g, PKCS#1v1.5, ECDSA
"""
authors = ["Tony Arcieri <tony@iqlusion.io>", "Yubico AB"]
license = "BSD-2-Clause"
repository = "https://github.com/iqlusioninc/yubikey.rs"
readme = "README.md"
categories = ["api-bindings", "authentication", "cryptography", "hardware-support"]
keywords = ["ecdsa", "encryption", "rsa", "piv", "signature"]
edition = "2024"
rust-version = "1.89"

[workspace]
members = [".", "cli"]

[workspace.dependencies]
sha2 = "0.11"
x509-cert = { version = "0.3", features = ["builder", "hazmat"] }

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
bitflags = "2.5"
cipher = { version = "0.5", features = ["getrandom", "rand_core"] }
curve25519-dalek = "5"
der = "0.8"
des = "0.9"
ecdsa = { version = "0.17", features = ["digest", "pem"] }
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8"] }
elliptic-curve = "0.14.1"
hex = { package = "base16ct", version = "1", features = ["alloc"] }
log = "0.4"
nom = "8"
p256 = "0.14"
p384 = "0.14"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
pcsc = "2.9"
rand = "0.10"
rand_core = "0.10"
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { workspace = true, features = ["oid"] }
signature = "3"
subtle = "2"
uuid = { version = "1.2", features = ["v4"] }
x25519-dalek = "3"
x509-cert.workspace = true
zeroize = "1"

[dev-dependencies]
env_logger = "0.11"
once_cell = "1"

[[example]]
name = "change-mode"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
